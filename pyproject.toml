[project]
name = "metapet"
version = "0.1.0"
description = "A small command-line tool for keeping your side-project ideas in one place."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javad Razi" }]
requires-python = ">=3.11"
keywords = ["cli", "ideas", "markdown", "notes", "side-projects"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = [
    "anyascii>=0.3",
    "click>=8.1",
    "platformdirs>=4.2",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0.1",
    "prompt-toolkit>=3.0.36",
    "questionary>=2.1.1",
    "rich>=14.3",
    "textual>=8.0",
    "typer>=0.16",
]

[project.urls]
Homepage = "https://github.com/jrazi/metapet"
Repository = "https://github.com/jrazi/metapet"
Issues = "https://github.com/jrazi/metapet/issues"
Changelog = "https://github.com/jrazi/metapet/blob/main/CHANGELOG.md"

[project.scripts]
pet = "metapet.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [".github", "docs", "uv.lock"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
